# Appliance knobs. Sourced as shell by every streamer-* script and by the
# streamer command.
#
# The root filesystem is mounted read-only, from the first boot. To edit this
# file:
#   streamer rw          mount / read-write
#   sudo nano /etc/streamer.conf
#   sync && streamer ro  mount / read-only again
# then reboot.

# What to play when there is no saved appliance state. This is one of the
# built-in cliamp radio endpoints; `streamer stations` lists the others.
STREAMER_START_KIND=url
STREAMER_START_TARGET=https://radio.cliamp.stream/lofi/stream

# Which streaming services a `streamer playlist <provider>:<id>` target can
# name. cliamp only accepts a provider it has credentials configured for, and
# this list is what tells the streamer command where the prefix ends and the
# playlist id begins. `radio` is in it because cliamp spells the channel it
# is on with that prefix - "radio:l:0", verified on the card 2026-11-21 - and
# a boot told to load that name with `cliamp load` fails on a missing .toml:
# only provider.load can open it, so the appliance has to recognise the prefix
# to record the intent at all.
STREAMER_PROVIDERS="tidal qobuz spotify radio"

# Where `streamer stations` reads its list from. That list belongs to the radio
# service, it is not stored on this box, so the command needs the network.
STREAMER_STATION_LIST=https://radio.cliamp.stream/stations

# Volume in dB, exactly as cliamp reports it (0 dB = no attenuation; the
# player floor is volume_min in /data/cliamp/config.toml). STREAMER_VOL_FLOOR
# is the level playback starts at, so an amplifier that is already on and
# turned up never hears full volume on boot.
STREAMER_VOL_FLOOR=-30

# Where the ramp ends when there is no saved level to go back to, which in
# practice means the first boot after a flash. Deliberately well below 0 dB:
# 0 dBFS from the DAC is 2.0 V into an input that reaches rated power at
# 150 mV, so an amp whose knob was left at maximum would be asked for 75 W
# just because the box was unplugged. -20 dB is 0.63 V, about 13 W at that
# worst-case knob position, and sits in the range the PRD calls normal
# living-room listening. The saved level of the previous session wins over
# this; see STREAMER_STATE below.
STREAMER_VOL_TARGET=-20

# cliamp itself refuses to go below volume_min in /data/cliamp/config.toml or
# above +6 dB. Clamped to this range so a hand-edited state file can neither
# silence the box nor ask the amplifier for more than the DAC has.
STREAMER_VOL_MAX=6

# A fixed trim on the DAC board's own codec volume, not the player's. The
# Pi-DAC+'s SC2078 has a digital volume inside the chip - amixer calls it
# 'Digital' on card 0, 0 dB at 207 and 0.5 dB per step - and it comes back at
# 0 dB every power-on. It belongs here rather than in the player's level
# because the player's volume is the person's: saved in the session and in
# the boot intent, and everything about the ramp assumes the same scale the
# jack setup had. Same convention as cliamp's volume: 0 means no trim.
# The figure is the full-scale output difference between the two audio
# setups, measured on the bench 2026-11-20: the DAC line output is 2.0 V RMS
# at 0 dBFS, the Pi's filtered-PWM jack only reaches ~0.3 V, about 16 dB
# apart - which is why -16 makes the two setups equally loud at any cliamp
# level, and matches the PRD's 22.5 dB over the amp's 150 mV rated input.
# Trimmed at the codec, not by the amplifier's knob, this is the dithered
# digital path §6.4's open bench question wanted anyway. streamer-daemon
# applies it at every daemon start; cards with no 'Digital' control - the
# analog jack among them - are left alone.
STREAMER_DAC_GAIN=-20

# Ramp: STREAMER_RAMP_STEP dB every STREAMER_RAMP_DELAY s, starting
# STREAMER_RAMP_START s after playback reaches the playing state. The power
# amplifier closes its speaker relay a couple of seconds after power-on, so
# the first thing it hears is quiet, and it never hears a step change.
STREAMER_RAMP_START=1.0
STREAMER_RAMP_STEP=3
STREAMER_RAMP_DELAY=0.4

# How long the ramp may take, in steps. The worst case is the floor to the
# ceiling: 36 dB / 3 dB is 12 steps, so 16 covers it with room, and at
# 0.4 s each that is 6.4 s inside a 10 s budget. The ramp also stops on its own
# if the level refuses to move, which is what happens when the output device
# clamps it below where cliamp thinks it is; this is the backstop for the rest.
STREAMER_RAMP_MAX_STEPS=16

# cliamp audio engine. sample_rate 0 = 44100; raise to 96000 or 192000 only
# if you want hi-res Tidal to reach the DAC without resampling.
STREAMER_BUFFER_MS=500
STREAMER_SAMPLE_RATE=0

# Budgets, seconds. STREAMER_SYNC_WAIT only bites on an https target, before
# the first TLS handshake of a cold boot: see the clock note in streamer-play.
# STREAMER_NET_WAIT covers both name resolution for a stream URL and, for a
# playlist on a streaming service, simply having a route and an address: the
# provider's session cannot be refreshed without one, and a load asked for
# before the lease arrives is answered "sign-in required".
STREAMER_SOCKET_WAIT=8
STREAMER_PLAY_WAIT=20
STREAMER_NET_WAIT=10
STREAMER_SYNC_WAIT=30

# The writable partition, and the tree it was built from. `streamer reset` copies
# the second over the first, and the image makes both from the same directory, so
# a reset card and a freshly built one are the same box. Everything the appliance
# keeps on that partition is derived from STREAMER_DATA below, so changing one
# line moves the whole appliance off the card.
STREAMER_DATA=/data
STREAMER_SEED=/usr/share/streamer/seed

# The account the appliance runs as, and owns its writable partition with. The
# systemd units say User=pi; this is the same name, written down once so
# `streamer reset` can put the ownership right without hard-coding it.
STREAMER_USER=pi
STREAMER_GROUP=pi

# What to play next boot, at what level, and one line per boot saying what came
# out of the speakers. journald is left volatile on purpose (see
# /etc/journald.conf.d/streamer.conf), so `journalctl -b` only covers the boot you
# are in; after a power cut this log is the only surviving trace of the previous
# one, which is why the scripts at both ends of the boot append to it.
STREAMER_STATE=$STREAMER_DATA/streamer/state
STREAMER_BOOTLOG=$STREAMER_DATA/streamer/boot.log
STREAMER_BOOTLOG_KEEP=200

# The LAN control server (streamer-http): a web page on this port that drives
# the player from a phone or any other computer, no SSH or client needed.
# Every /api call needs the secret in STREAMER_HTTP_TOKEN, which the server
# creates by itself on the first boot and prints once into the journal
# (`streamer log` finds it, or: sudo cat the file). The token lives on /data,
# so `streamer reset` wipes it and the next boot makes a new one.
STREAMER_HTTP_PORT=8077
STREAMER_HTTP_TOKEN=$STREAMER_DATA/streamer/http.token

# The radio section on that page: similar songs for the Tidal track that is
# playing, from Tidal's own API, because cliamp has no radio operation at all.
# The card borrows - reads, never refreshes - the Tidal login cliamp keeps at
# STREAMER_TIDAL_CRED; that file belongs to cliamp, and two programs refreshing
# one OAuth session is how logins get killed. STREAMER_RADIO_SIZE is how many
# similar songs are offered at once, for queueing them and for saving them as
# a playlist in the Tidal account. STREAMER_RADIO_PROVIDERS names the providers
# whose rows the radio can follow at all: only Tidal has a track radio, so that
# list is Tidal alone today, and it is a knob rather than a fact baked into
# the page so the page hides its radio section by asking the card, never by
# matching a path scheme itself.
STREAMER_RADIO_SIZE=50
STREAMER_RADIO_PROVIDERS=tidal
STREAMER_TIDAL_CRED=$STREAMER_DATA/cliamp/tidal_credentials.json
