# Appliance knobs, sourced as shell by every atibi-* script and by the
# atibi command. Read-only root: `atibi rw`, edit, `sync && atibi ro`.

# What to play when there is no saved state: a built-in cliamp radio endpoint.
ATIBI_START_KIND=url
ATIBI_START_TARGET=https://radio.cliamp.stream/lofi/stream

# Provider prefixes, and where a prefix ends and a list id begins. `radio` is in
# the list because cliamp spells its live channel `radio:l:0`, which only
# provider.load can open.
ATIBI_PROVIDERS="tidal qobuz spotify radio"

# Fetched rather than baked, so the box and the service cannot drift apart.
ATIBI_STATION_LIST=https://radio.cliamp.stream/stations

# Where playback starts, so an amp already on and turned up never hears full
# volume on boot. dB as cliamp reports it: 0 = no attenuation, and it clamps on
# its own to volume_min in /data/cliamp/config.toml and to +6.
ATIBI_VOL_FLOOR=-30
# Where the ramp ends with no saved level: 0 dBFS is 2.0 V into an input rated
# at 150 mV, so this is the safe first guess; a saved level wins over it.
ATIBI_VOL_TARGET=-20
# A hand-edited state file can neither silence the box nor out-power the DAC.
ATIBI_VOL_MAX=6

# The DAC board's own codec volume ('Digital'), not the player's
ATIBI_DAC_GAIN=-20

# Ramp step dB, step seconds, delay after playback reaches the playing state:
# the amp's speaker relay closes a couple of seconds after power-on, so the first
# thing it hears is quiet and never a step change.
ATIBI_RAMP_START=1.0
ATIBI_RAMP_STEP=3
ATIBI_RAMP_DELAY=0.4

# Step budget: 16 x 0.4 s covers floor to ceiling in 10s.
# The ramp also stops on its own when the level refuses to move, which is what a
# clamping output device looks like; this is the backstop for the rest.
ATIBI_RAMP_MAX_STEPS=16

# cliamp output sample rate in Hz (0=auto)
ATIBI_SAMPLE_RATE=0
ATIBI_BUFFER_MS=500

# Seconds. The net wait covers name resolution for a stream and, for a provider
# playlist, merely having a route: a load asked for before the DHCP lease lands
# is answered "sign-in required". The sync wait bites only on https targets —
# a cold-boot clock behind NTP fails every TLS handshake.
ATIBI_SOCKET_WAIT=8
ATIBI_PLAY_WAIT=20
ATIBI_NET_WAIT=10
ATIBI_SYNC_WAIT=30
# The file whose presence says NTP has landed, which is what an https target waits
# for. timesyncd touches it; with no NTP reachable the box still has to try to play.
ATIBI_TIME_SYNC_FLAG=/run/systemd/timesync/synchronized
# After the sound, how long the boot waits for NTP to re-anchor the clock
# stamp below. Bounded like every other wait; no NTP means no stamp.
ATIBI_SYNC_HOLD=30

# The writable partition, and the tree it was built from: both come from the
# same directory in the build, so `atibi reset` and a fresh card match.
# Everything the appliance keeps on /data derives from this line.
ATIBI_DATA=/data
ATIBI_SEED=/usr/share/atibi/seed

# The account that owns /data, the same one the units run as.
ATIBI_USER=pi
ATIBI_GROUP=pi

# What plays next boot and how loud, plus one line per boot saying what came
# out of the speakers. journald is volatile, so this log outlives a power cut.
ATIBI_STATE=$ATIBI_DATA/atibi/state
ATIBI_BOOTLOG=$ATIBI_DATA/atibi/boot.log
ATIBI_BOOTLOG_KEEP=200
# The clock stamp the boot saves and atibi-clock hands back; /var's own
# stamp froze at the build date on the read-only root.
ATIBI_CLOCK=$ATIBI_DATA/atibi/clock

# LAN control server: port, and the secret every /api call must carry. The server
# makes the token on first boot, prints it once to the journal, and keeps it on
# /data so `atibi reset` wipes it.
ATIBI_HTTP_PORT=8077
ATIBI_HTTP_TOKEN=$ATIBI_DATA/atibi/http.token

# Suggested songs for the row playing now, from the provider's own API, since
# cliamp has no radio operation. The login belongs to cliamp: read here, never
# refreshed. The provider list is a knob so the web page asks the server which rows
# the radio can follow instead of matching a path scheme itself.
ATIBI_RADIO_SIZE=50
ATIBI_RADIO_PROVIDERS=tidal
ATIBI_TIDAL_CRED=$ATIBI_DATA/cliamp/tidal_credentials.json
